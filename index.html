<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routing to RikkaHub...</title>
  <style>
    body { background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
    a { background: #6200ea; color: white; padding: 16px 24px; border-radius: 24px; text-decoration: none; font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>
  <a id="forwardBtn" href="#">Send to RikkaHub</a>
  <script>
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');
    
    if (query) {
      // Build the Intent URI dynamically based on QuickSearch's query
      const intentUri = "intent:#Intent;action=android.intent.action.SEND;type=text/plain;package=me.rerere.rikkahub;component=me.rerere.rikkahub/me.rerere.rikkahub.RouteActivity;S.android.intent.extra.TEXT=" + encodeURIComponent(query) + ";end";
      
      const btn = document.getElementById('forwardBtn');
      btn.href = intentUri;
      
      // Attempt to auto-redirect. Chrome sometimes blocks intent auto-redirects 
      // without a user gesture, so the screen includes a fallback button.
      window.location.replace(intentUri);
    } else {
      document.body.innerHTML = "<h2 style='color:white;'>No query provided</h2>";
    }
  </script>
</body>
</html>
